<!-- 站点版（GitHub Pages 用）：由 tools/build_ghpages.js 从 preview/src.html 生成，勿手改 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>科研塔罗牌 · Research Tarot</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{
    --bg:#12102a;
    --panel:rgba(255,255,255,.045);
    --line:rgba(232,200,119,.22);
    --gold:#e8c877;
    --gold-dim:#a98f4e;
    --ink:#f4f0e6;
    --muted:#9d96bd;
    --up:#5fd6a4;
    --down:#f08a8a;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#08071a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  .app{
    position:relative;
    width:100%;max-width:430px;height:100vh;max-height:900px;
    background:
      radial-gradient(900px 520px at 50% -10%, #30265e 0%, rgba(48,38,94,0) 60%),
      radial-gradient(600px 420px at 90% 110%, #2a1b46 0%, rgba(42,27,70,0) 65%),
      linear-gradient(180deg,#15122f 0%, #0e0c22 100%);
    overflow:hidden;
    box-shadow:0 0 80px rgba(0,0,0,.6);
    display:flex;flex-direction:column;
  }
  @media(min-width:431px){ .app{border-radius:26px;height:880px;} }

  .stars{position:absolute;inset:0;pointer-events:none;opacity:.55;}
  .stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 3.5s infinite ease-in-out;}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1)}}

  .screen{
    position:absolute;inset:0;padding:26px 22px 30px;
    display:none;flex-direction:column;overflow-y:auto;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none}
  .screen.on{display:flex;animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:32px;}
  .back{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--gold);
    font-size:18px;cursor:pointer;flex:0 0 auto;background:var(--panel);
  }
  .topbar h2{margin:0;font-size:16px;font-weight:600;letter-spacing:.5px;color:var(--gold);}

  h1.brand{
    margin:34px 0 6px;font-size:34px;font-weight:700;letter-spacing:6px;
    background:linear-gradient(180deg,#fff5dd,#e8c877 55%,#b08b3c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-align:center;
  }
  .brand-sub{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:3px;margin-bottom:6px;}
  .brand-en{text-align:center;color:var(--gold-dim);font-size:10px;letter-spacing:3px;margin-bottom:26px;}

  .btn{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:16px 18px;margin-bottom:12px;border-radius:var(--radius);
    background:linear-gradient(135deg,rgba(232,200,119,.13),rgba(232,200,119,.04));
    border:1px solid var(--line);color:var(--ink);cursor:pointer;
    transition:transform .15s ease, background .2s ease;
    text-align:left;font-family:inherit;
  }
  .btn:active{transform:scale(.975);background:rgba(232,200,119,.2);}
  .btn .ico{font-size:24px;width:30px;text-align:center;flex:0 0 auto;}
  .btn .t{font-size:15.5px;font-weight:600;display:block;}
  .btn .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;display:block;}
  .btn.ghost{background:var(--panel);}

  .hint{text-align:center;color:var(--gold-dim);font-size:11px;letter-spacing:1px;margin-top:auto;padding-top:16px;}

  /* ---------- 牌背 ---------- */
  .backface{
    border-radius:16px;
    background:
      repeating-linear-gradient(45deg,rgba(232,200,119,.07) 0 6px,transparent 6px 12px),
      radial-gradient(circle at 50% 40%, #3b2f6b 0%, #221a45 70%);
    border:1px solid rgba(232,200,119,.35);
    box-shadow:0 12px 30px rgba(0,0,0,.5), inset 0 0 30px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .backface::after{content:'✦';color:rgba(232,200,119,.55);font-size:34px;}
  .backface .ring{position:absolute;inset:10px;border:1px solid rgba(232,200,119,.25);border-radius:10px;}

  /* ---------- 洗牌 ---------- */
  #s-shuffle{align-items:center;justify-content:center;}
  .shuffle-wrap{position:relative;width:220px;height:320px;margin-bottom:28px;}
  .shuffle-wrap .backface{position:absolute;inset:0;animation:shuf 1.1s infinite ease-in-out;}
  .shuffle-wrap .backface:nth-child(1){animation-delay:0s}
  .shuffle-wrap .backface:nth-child(2){animation-delay:.12s}
  .shuffle-wrap .backface:nth-child(3){animation-delay:.24s}
  .shuffle-wrap .backface:nth-child(4){animation-delay:.36s}
  .shuffle-wrap .backface:nth-child(5){animation-delay:.48s}
  @keyframes shuf{
    0%{transform:translateX(0) rotate(-5deg)}
    30%{transform:translateX(-26px) rotate(3deg)}
    60%{transform:translateX(24px) rotate(-2deg)}
    100%{transform:translateX(0) rotate(-5deg)}
  }
  .shuffle-txt{color:var(--muted);font-size:13px;letter-spacing:4px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- 牌面：韦特贴图 + 下方缩略的自创牌面 ---------- */
  #s-result,#s-spread{align-items:center;}
  .card-stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}
  .flip{width:232px;aspect-ratio:320/548;perspective:1200px;flex:0 0 auto;position:relative;}
  .flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.8,.25,1);}
  .flip.up .flip-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;}
  .face.front{transform:rotateY(180deg);}
  .art{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px;
       box-shadow:0 14px 34px rgba(0,0,0,.62);transition:transform .55s ease;}
  .art.rv{transform:rotate(180deg);}

  .mine{display:flex;flex-direction:column;align-items:center;gap:3px;
        opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease;}
  .mine.show{opacity:1;transform:none;}
  .mine-top{display:flex;align-items:center;gap:6px;}
  .mine-emo{font-size:15px;line-height:1;}
  .mine-nm{font-size:16px;font-weight:700;letter-spacing:3px;color:#fff6e2;}
  .mine-sc{font-size:9.5px;line-height:1;padding:3px 7px;border-radius:20px;letter-spacing:1px;
           color:#e8c877;background:rgba(232,200,119,.12);border:1px solid rgba(232,200,119,.35);}
  .mine-en{font-size:9px;letter-spacing:.5px;color:#9d96bd;}
  .mine-kw{font-size:9px;color:var(--gold);letter-spacing:1px;}
  .mine .pos{margin-top:2px;font-size:9px;letter-spacing:1.5px;padding:2px 9px;
             border-radius:20px;border:1px solid currentColor;}
  .mine .pos.up{color:var(--up)}
  .mine .pos.down{color:var(--down)}

  .readout{
    width:100%;margin-top:18px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;
  }
  .readout .lb{font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:7px;}
  .readout p{margin:0;font-size:13.5px;line-height:1.85;color:#e9e4d8;}
  .advice{background:rgba(95,214,164,.07);border-color:rgba(95,214,164,.28);}
  .advice .lb{color:var(--up);}
  .research{background:rgba(232,200,119,.08);border-color:rgba(232,200,119,.32);}
  .readout + .readout{margin-top:10px;border-radius:14px;}

  /* 金句：点题的那句话，放在解读最上方 */
  .readout.quote{
    margin-top:16px;padding:20px 18px;text-align:center;
    background:linear-gradient(160deg,rgba(232,200,119,.13),rgba(232,200,119,.04));
    border-color:rgba(232,200,119,.4);
  }
  .readout.quote p{
    font-size:14px;line-height:1.95;color:#f2e0b0;font-style:italic;letter-spacing:1.2px;
  }
  .readout.quote p::before{content:'「';opacity:.55;margin-right:2px;}
  .readout.quote p::after{content:'」';opacity:.55;margin-left:2px;}
  /* 三张牌阵详情里的金句 */
  .item .qt{
    margin:0 0 8px;font-size:12.5px;line-height:1.8;color:#f2e0b0;font-style:italic;
    letter-spacing:1px;padding:8px 12px;border-radius:10px;
    background:rgba(232,200,119,.09);border-left:2px solid rgba(232,200,119,.45);
  }
  /* 图鉴弹层里的金句 */
  .sh-line.quote{
    text-align:center;padding:14px 12px;margin-bottom:16px;border-radius:12px;
    background:linear-gradient(160deg,rgba(232,200,119,.13),rgba(232,200,119,.04));
    border:1px solid rgba(232,200,119,.35);
  }
  .sh-line.quote .v{font-size:13.5px;color:#f2e0b0;font-style:italic;line-height:1.9;letter-spacing:1px;}

  .reset{display:none;margin-top:14px;font-size:10px;letter-spacing:1px;color:var(--muted);
         text-decoration:underline;cursor:pointer;opacity:.75;}
  .reset:hover{opacity:1;color:var(--gold-dim);}
  .ver{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:1.5px;
       color:var(--gold-dim);border:1px solid var(--line);border-radius:20px;
       padding:3px 12px;opacity:.85;}
  .warn{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;box-sizing:border-box;
        background:rgba(240,138,138,.12);border:1px solid rgba(240,138,138,.45);
        color:#ffb4b4;font-size:11.5px;line-height:1.75;text-align:left;}
  .row{display:flex;gap:10px;width:100%;margin-top:16px;}
  .row .btn{margin-bottom:0;justify-content:center;background:var(--panel);}
  .row .btn .ico{font-size:18px;width:auto;}

  /* ---------- 三张牌阵 ---------- */
  .spread-row{display:flex;gap:11px;margin-top:8px;width:100%;}
  .spread-col{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
  .spread-col .slot-lb{font-size:11px;color:var(--gold-dim);letter-spacing:2px;margin-bottom:8px;}
  .flip.mini{width:100%;}
  .flip.mini .art{border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.5);}
  .mine.mini{gap:1px;}
  .mine.mini .mine-emo{font-size:11px;}
  .mine.mini .mine-nm{font-size:11.5px;letter-spacing:.5px;}
  .mine.mini .mine-sc{font-size:8px;padding:2px 5px;letter-spacing:0;}
  .mine.mini .mine-en{display:none;}
  .mine.mini .mine-kw{display:none;}
  .mine.mini .pos{margin-top:2px;font-size:8px;padding:1px 6px;letter-spacing:0;}
  .flip.pending{cursor:pointer;animation:breathe 1.8s infinite ease-in-out;}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  .spread-detail{margin-top:20px;width:100%;}
  .spread-detail .item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .spread-detail .item .h{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .spread-detail .item .h b{font-size:14px;letter-spacing:1.5px;}
  .spread-detail .item .h span{font-size:10.5px;padding:2px 8px;border-radius:12px;border:1px solid currentColor;}
  .spread-detail .item .h span.up{color:var(--up)} .spread-detail .item .h span.down{color:var(--down)}
  .spread-detail .item .h span.sc{color:var(--gold);border-color:rgba(232,200,119,.4);background:rgba(232,200,119,.1);}
  .spread-detail .item p{font-size:12.5px;line-height:1.8;color:#ddd7c9;margin:0;}
  .spread-detail .item p.rs{margin-top:9px;font-size:12px;color:#e8c877;background:rgba(232,200,119,.08);
    padding:8px 10px;border-radius:8px;border-left:2px solid rgba(232,200,119,.5);}
  .spread-detail .item p.ad{margin-top:7px;font-size:12px;color:#5fd6a4;}

  .summary{margin-top:4px;width:100%;background:linear-gradient(135deg,rgba(232,200,119,.14),rgba(232,200,119,.03));
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .summary .lv{font-size:20px;font-weight:700;letter-spacing:4px;color:var(--gold);margin-bottom:8px;}
  .summary .lv.good{color:var(--gold);}
  .summary .lv.mid{color:#cdc7dd;}
  .summary .lv.bad{color:var(--down);}
  .summary .lv .doom-tag{display:inline-block;margin-left:10px;padding:2px 9px;border:1px solid var(--down);
    border-radius:99px;font-size:10px;font-weight:400;letter-spacing:1px;color:var(--down);vertical-align:middle;}
  .summary p{margin:0;font-size:13px;line-height:1.8;color:#e9e4d8;}

  /* ---------- 图鉴 ---------- */
  .tabs{display:flex;gap:7px;margin:4px 0;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:20px;font-size:12px;
    border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;background:var(--panel);}
  .tab.on{background:rgba(232,200,119,.18);color:var(--gold);border-color:var(--gold);font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;padding-bottom:20px;}
  .mini{
    background:linear-gradient(170deg,#2c2453,#1a1533);border:1px solid rgba(232,200,119,.28);
    border-radius:14px;padding:7px 7px 8px;text-align:center;cursor:pointer;overflow:hidden;
  }
  .mini .thumb{width:100%;display:block;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.45);}
  .mini .n{font-size:12.5px;font-weight:600;letter-spacing:1px;margin-top:7px;color:#fff3dd;}
  .mini .a{font-size:9px;color:var(--muted);margin-top:2px;}

  /* ---------- 弹层 ---------- */
  .sheet{position:absolute;inset:0;background:rgba(6,5,16,.72);backdrop-filter:blur(6px);
    display:none;align-items:flex-end;z-index:20;}
  .sheet.on{display:flex;animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet-box{width:100%;max-height:84%;overflow-y:auto;background:linear-gradient(180deg,#221c42,#15122e);
    border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 20px 30px;
    animation:up .3s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head b{font-size:19px;letter-spacing:2px;}
  .close{color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
  .sh-hero{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start;}
  .sh-hero img{width:96px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:block;}
  .sh-hero .meta{flex:1;min-width:0;}
  .sh-hero .meta .e{font-size:26px;line-height:1;}
  .sh-hero .meta .n{font-size:17px;font-weight:700;letter-spacing:2px;margin-top:6px;color:#fff3dd;}
  .sh-hero .meta .sc{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;margin-top:6px;
                     letter-spacing:1px;color:var(--gold);background:rgba(232,200,119,.12);border:1px solid rgba(232,200,119,.35);}
  .sh-hero .meta .k{font-size:11.5px;color:var(--gold);margin-top:6px;letter-spacing:1px;}
  .sh-hero .meta .en{font-size:10px;color:var(--muted);margin-top:4px;}
  .sh-line{margin-bottom:14px;}
  .sh-line .k{font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:5px;}
  .sh-line .v{font-size:13.5px;line-height:1.8;color:#e6e0d2;}
  .sh-line .v.up{color:var(--up)} .sh-line .v.down{color:var(--down)}
  .sh-line.research{background:rgba(232,200,119,.07);border-left:2px solid var(--gold);
    padding:10px 12px;border-radius:0 10px 10px 0;}
</style>
</head>
<body>
<div class="app">
  <div class="stars" id="stars"></div>

  <!-- 首页 -->
  <div class="screen on" id="s-home">
    <h1 class="brand">科研塔罗牌</h1>
    <div class="brand-sub">R E S E A R C H &nbsp; T A R O T</div>
    <div class="brand-en">78 CARDS · RIDER-WAITE-SMITH</div>
    <div class="ver" id="ver-badge">—</div>
    <div id="home-warn"></div>

    <button class="btn" onclick="go('single')">
      <span class="ico">🔮</span>
      <span><span class="t">今日一抽</span><span class="d" id="today-desc">只抽大阿尔卡纳 · 一天一次</span></span>
    </button>
    <button class="btn" onclick="go('three')">
      <span class="ico">🎴</span>
      <span><span class="t">三张牌阵</span><span class="d">过去 · 现在 · 未来 · 全 78 张牌池</span></span>
    </button>
    <button class="btn ghost" onclick="openGallery()">
      <span class="ico">📖</span>
      <span><span class="t">牌面图鉴</span><span class="d">78 张完整牌库 · 五组分类查阅</span></span>
    </button>

    <div class="reset" id="today-reset" onclick="resetToday()">清除今日记录 · 重新抽</div>
    <div class="hint">娱乐为主 · 建议为辅 · 别拿它决定人生<span id="build-at"></span></div>
  </div>

  <!-- 洗牌 -->
  <div class="screen" id="s-shuffle">
    <div class="shuffle-wrap">
      <div class="backface"><span class="ring"></span></div>
      <div class="backface"><span class="ring"></span></div>
      <div class="backface"><span class="ring"></span></div>
      <div class="backface"><span class="ring"></span></div>
      <div class="backface"><span class="ring"></span></div>
    </div>
    <div class="shuffle-txt">洗 牌 中</div>
  </div>

  <!-- 单张结果 -->
  <div class="screen" id="s-result">
    <div class="topbar"><div class="back" onclick="home()">‹</div><h2>今日一抽 · 大阿尔卡纳</h2></div>
    <div id="r-flip" style="width:100%;display:flex;justify-content:center;"></div>
    <div id="r-read" style="width:100%;"></div>
    <div class="row">
      <button class="btn ghost" onclick="redrawToday()"><span class="ico">🔄</span><span class="t">换一张</span></button>
      <button class="btn" onclick="copyText('single')"><span class="ico">📋</span><span class="t">复制文案</span></button>
      <button class="btn" onclick="home()"><span class="ico">🏠</span><span class="t">返回</span></button>
    </div>
  </div>

  <!-- 三张牌阵 -->
  <div class="screen" id="s-spread">
    <div class="topbar"><div class="back" onclick="home()">‹</div><h2>三张牌阵</h2></div>
    <div class="spread-row" id="sp-row"></div>
    <div class="spread-detail" id="sp-detail"></div>
    <div class="summary" id="sp-sum" style="display:none"></div>
    <div class="row">
      <button class="btn" onclick="copyText('three')"><span class="ico">📋</span><span class="t">复制文案</span></button>
      <button class="btn" onclick="go('three')"><span class="ico">🔄</span><span class="t">再抽一次</span></button>
    </div>
  </div>

  <!-- 图鉴 -->
  <div class="screen" id="s-gallery">
    <div class="topbar"><div class="back" onclick="home()">‹</div><h2>牌面图鉴</h2></div>
    <div class="tabs" id="g-tabs"></div>
    <div class="grid" id="g-grid"></div>
  </div>

  <!-- 详情弹层 -->
  <div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
    <div class="sheet-box" id="sheet-box"></div>
  </div>
</div>

<script>

};
/* 唯一的「凶」：这一组牌 + 三张全逆位 —— 过载 → 崩塌 → 彻底黄
   456,456 种排列 × 8 种正逆 = 3,651,648 种结果里，只有这一种判凶；
   只要有一张是正位，就回到下面的正逆顺序系统正常判定 */
const DOOM = ['权杖十', '高塔', '宝剑十'];
const DOOM_LV = { level:'凶', tone:'bad', doom:true,
  text:'过去一个人扛下所有，现在突然崩塌，未来彻底触底——而且三张全是逆位。这是 456,456 种排列 × 8 种正逆组合 = 3,651,648 种结果里，唯一被判为凶的一种。抽到它也算一种运气：坏到底了，接下来每一步都是往上。今天只做一件事：把这三张的提醒各写一句，然后去睡一觉。' };
function summaryOf(cs){
  const t = cs.length;
  if (t === 3 && cs.every(c => c.reversed) && cs.every((c, i) => c.name === DOOM[i])) return DOOM_LV;
  const key = cs.map(c => c.reversed ? 'R' : 'U').join('');
  if (SPREAD_LV[key]) return SPREAD_LV[key];
  /* 非三张时按正位占比兜底 */
  const up = cs.filter(c => !c.reversed).length;
  if (up === t) return { level:'大吉', tone:'good', text:'全正位，局势在你这边。想清楚的事就推进，别再反复论证。' };
  if (up >= Math.ceil(t / 2)) return { level:'小吉', tone:'good', text:'整体向好，但有一处需要你主动处理——重点看逆位那张牌的卡点。' };
  if (up > 0) return { level:'平', tone:'mid', text:'阻力略大于助力。别硬推，先解决逆位牌指出的卡点，再谈进度。' };
  return { level:'小凶', tone:'bad', text:'全逆位。今天适合躺平和复盘，不建议做任何重大决定——包括退学。' };
}

function todayRec(){
  let rec = null;
  try { rec = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
  if (!rec) return null;
  if (BUILD_AT && rec.build !== BUILD_AT) {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    return null;
  }
  if (rec.date !== today()) return null;
  return rec;
}
function refreshToday(){
  const rec = todayRec();
  const el = document.getElementById('today-desc');
  if (!el) return;
  if (rec && rec.date === today()) {
    el.textContent = '今日已抽：' + rec.name + (rec.scene ? '（' + rec.scene + '）' : '') + '（' + (rec.reversed ? '逆位' : '正位') + '）· 点击查看';
  } else {
    el.textContent = '只抽大阿尔卡纳 · 一天一次';
  }
  const rst = document.getElementById('today-reset');
  if (rst) rst.style.display = (rec && rec.date === today()) ? 'block' : 'none';
  const vb = document.getElementById('ver-badge');
  if (vb) vb.textContent = BUILD_AT ? ('构建于 ' + BUILD_AT) : '源文件 · 未构建';
  checkImages();
  const ba = document.getElementById('build-at');
  if (ba && BUILD_AT) ba.textContent = ' · 构建于 ' + BUILD_AT;
}
function resetToday(){
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  refreshToday();
}
function redrawToday(){
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  currentSingle = pickOne();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign({ date: today(), build: BUILD_AT }, currentSingle))); } catch (e) {}
  show('s-shuffle');
  setTimeout(() => renderSingle(currentSingle), 900);
}
/* 牌图自检。
   两种发布形态都合法：
     A 单机版 —— IMG_DATA 里内嵌了 78 张 base64，直接 OK；
     B 站点版（GitHub Pages / 本地服务器）—— IMG_DATA 为空，靠 IMG_BASE 相对路径读 assets/cards/。
   所以不能一看到 IMG_DATA 为空就报「打开错文件」，要真的去加载一张图验证。 */
function checkImages(){
  const box = document.getElementById('home-warn');
  if (!box) return;
  const n = (typeof IMG_DATA === 'object' && IMG_DATA) ? Object.keys(IMG_DATA).length : 0;
  if (n > 0) { box.innerHTML = ''; return; }           /* A：内嵌版，不用查 */
  const probe = new Image();                            /* B：抽一张试试 */
  probe.onload = function () { box.innerHTML = ''; };
  probe.onerror = function () {
    box.innerHTML = '<div class="warn">⚠️ 牌图取不到，牌面会是空白的。<br>'
      + '这份页面靠相对路径 <b>' + IMG_BASE + '</b> 读图，需要 <b>assets/cards/</b> 目录跟它放在一起。<br>'
      + '如果你是直接双击打开的 <b>preview/src.html</b>，请改用根目录的 <b>科研塔罗牌.html</b>（图已内嵌，单文件可用）。</div>';
  };
  probe.src = imgSrc('major-00.jpg');
}
function go(mode){
  if (mode === 'single') {
    const rec = todayRec();
    if (rec) { currentSingle = rec; renderSingle(rec); return; }
    currentSingle = pickOne();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign({ date: today(), build: BUILD_AT }, currentSingle))); } catch (e) {}
    show('s-shuffle');
    setTimeout(() => renderSingle(currentSingle), 1700);
  } else {
    show('s-shuffle');
    setTimeout(() => renderSpread(pickMany(3)), 1700);
  }
}
function renderSingle(c){
  const box = document.getElementById('r-flip');
  box.innerHTML = cardHTML(c, false);
  show('s-result');
  const im = box.querySelector('.art');
  if (im) {
    im.onerror = function () {
      const rd = document.getElementById('r-read');
      const w = document.createElement('div');
      w.className = 'warn';
      const n = (typeof IMG_DATA === 'object' && IMG_DATA) ? Object.keys(IMG_DATA).length : 0;
      w.textContent = '⚠️ 牌图加载失败：' + (c.img || '?') + '。'
        + (n > 0 ? '内嵌图库共 ' + n + ' 张，其中' + (IMG_DATA[c.img] ? '有' : '没有') + '这张。'
                 : '这份是站点版，图走相对路径 ' + IMG_BASE + '，请确认 assets/cards/ 目录与页面在一起。');
      rd.insertBefore(w, rd.firstChild);
    };
  }
  setTimeout(() => {
    box.querySelector('.flip').classList.add('up');
    box.querySelector('.mine').classList.add('show');
  }, 260);
  document.getElementById('r-read').innerHTML =
    (c.quote ? '<div class="readout quote"><p>' + c.quote + '</p></div>' : '')
    + '<div class="readout"><div class="lb">解 读 · ' + (c.reversed ? '逆位' : '正位') + '（事业学业）</div><p>'
      + (c.reversed ? c.revText : c.upright) + '</p></div>'
    + '<div class="readout research"><div class="lb">科 研 预 测</div><p>' + c.research + '</p></div>'
    + '<div class="readout advice"><div class="lb">行 动 建 议</div><p>' + c.advice + '</p></div>';
}

/* ============ 三张牌阵 ============ */
let currentThree = [], flipped = 0;
function renderSpread(cards){
  currentThree = cards; flipped = 0;
  const row = document.getElementById('sp-row');
  row.innerHTML = cards.map((c, i) =>
    '<div class="spread-col" data-i="' + i + '"><div class="slot-lb">' + SLOT[i] + '</div>'
    + cardHTML(c, true).replace('class="flip', 'class="flip pending') + '</div>').join('');
  row.querySelectorAll('.spread-col').forEach((col, i) => {
    col.onclick = () => {
      const f = col.querySelector('.flip');
      if (f.classList.contains('up')) return;
      f.classList.remove('pending');
      f.classList.add('up');
      col.querySelector('.mine').classList.add('show');
      flipped++;
      if (flipped === cards.length) setTimeout(renderSpreadDetail, 700);
    };
  });
  document.getElementById('sp-detail').innerHTML = '';
  document.getElementById('sp-sum').style.display = 'none';
  show('s-spread');
}
function renderSpreadDetail(){
  document.getElementById('sp-detail').innerHTML = currentThree.map((c, i) =>
    '<div class="item"><div class="h"><b>' + SLOT[i] + ' · ' + c.name + '</b>'
    + (c.scene ? '<span class="sc">' + c.scene + '</span>' : '')
    + '<span class="' + (c.reversed ? 'down' : 'up') + '">' + (c.reversed ? '逆位' : '正位') + '</span></div>'
    + (c.quote ? '<p class="qt">' + c.quote + '</p>' : '')
    + '<p>' + (c.reversed ? c.revText : c.upright) + '</p>'
    + '<p class="rs">🔬 ' + c.research + '</p>'
    + '<p class="ad">→ ' + c.advice + '</p></div>').join('');
  const s = summaryOf(currentThree);
  const sum = document.getElementById('sp-sum');
  sum.style.display = 'block';
  sum.innerHTML = '<div class="lv ' + (s.tone || 'good') + '">' + s.level
    + (s.doom ? '<span class="doom-tag">365 万分之一</span>' : '') + '</div><p>' + s.text + '</p>';
}

/* ============ 图鉴 ============ */
const GROUPS = [
  { key:'major', label:'大阿尔卡纳' },
  { key:'wands', label:'权杖 · 火' },
  { key:'cups', label:'圣杯 · 水' },
  { key:'swords', label:'宝剑 · 风' },
  { key:'pent', label:'星币 · 土' }
];
let curGroup = 'major';
function groupOf(key){
  return key === 'major' ? CARDS.filter(c => c.arcana === 'major') : CARDS.filter(c => c.suit === key);
}
function openGallery(){
  document.getElementById('g-tabs').innerHTML = GROUPS.map(g =>
    '<div class="tab' + (g.key === curGroup ? ' on' : '') + '" data-k="' + g.key + '">' + g.label + '</div>').join('');
  document.querySelectorAll('#g-tabs .tab').forEach(el => {
    el.onclick = () => { curGroup = el.dataset.k; openGallery(); };
  });
  document.getElementById('g-grid').innerHTML = groupOf(curGroup).map(c =>
    '<div class="mini" data-id="' + c.id + '">'
    + '<img class="thumb" src="' + imgSrc(c.img) + '" alt="' + c.en + '" loading="lazy" decoding="async">'
    + '<div class="n">' + c.name + '</div><div class="a">' + (c.scene || c.suitName) + '</div></div>').join('');
  document.querySelectorAll('#g-grid .mini').forEach(el => {
    el.onclick = () => openSheet(CARDS[+el.dataset.id]);
  });
  show('s-gallery');
}
function openSheet(c){
  document.getElementById('sheet-box').innerHTML =
    '<div class="sheet-head"><b>' + c.roman + ' · ' + c.name + '</b><span class="close" onclick="closeSheet()">✕</span></div>'
    + '<div class="sh-hero"><img src="' + imgSrc(c.img) + '" alt="' + c.en + '">'
    +   '<div class="meta"><div class="e">' + c.emoji + '</div>'
    +   '<div class="n">' + c.en + '</div>'
    +   (c.scene ? '<div class="sc">' + c.scene + '</div>' : '')
    +   '<div class="k">' + c.kw + '</div>'
    +   '<div class="en">' + (c.arcana === 'major' ? '大阿尔卡纳' : c.element) + '</div></div></div>'
    + (c.quote ? '<div class="sh-line quote"><div class="v">' + c.quote + '</div></div>' : '')
    + '<div class="sh-line"><div class="k">正 位 · 事业学业</div><div class="v up">' + c.upright + '</div></div>'
    + '<div class="sh-line"><div class="k">逆 位 · 事业学业</div><div class="v down">' + c.revText + '</div></div>'
    + '<div class="sh-line research"><div class="k">科 研 预 测</div><div class="v">' + c.research + '</div></div>'
    + '<div class="sh-line"><div class="k">行 动 建 议</div><div class="v">' + c.advice + '</div></div>';
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }

/* ============ 复制文案 ============ */
function copyText(mode){
  let t = '';
  if (mode === 'single' && currentSingle) {
    const c = currentSingle;
    t = '【科研塔罗 · 今日一抽】\n' + c.roman + ' ' + c.name + (c.scene ? '（' + c.scene + '）' : '')
      + '（' + (c.reversed ? '逆位' : '正位') + '）\n'
      + '解读：' + (c.reversed ? c.revText : c.upright) + '\n科研：' + c.research + '\n建议：' + c.advice;
  } else if (currentThree.length) {
    const s = summaryOf(currentThree);
    t = '【科研塔罗 · 三张牌阵】\n'
      + currentThree.map((c, i) => SLOT[i] + '：' + c.name + (c.scene ? '（' + c.scene + '）' : '') + '（' + (c.reversed ? '逆位' : '正位') + '）').join('\n')
      + '\n\n综合：' + s.level + '　' + s.text;
  }
  if (!t) return;
  navigator.clipboard && navigator.clipboard.writeText(t).then(
    () => toast('已复制，去群里整活吧'),
    () => toast(t)
  );
}
function toast(msg){
  const d = document.createElement('div');
  d.textContent = (msg && msg.length > 60) ? '复制失败，文案：' + msg.slice(0, 40) + '…' : (msg || '已复制');
  d.style.cssText = 'position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(232,200,119,.95);color:#221c42;padding:10px 18px;border-radius:20px;font-size:12.5px;z-index:99;max-width:80%;text-align:center;';
  document.querySelector('.app').appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

refreshToday();
</script>
